name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        testbench: ['^10', '^11']

    # Redis is required: ArgusServiceProvider opens a Redis buffer connection at
    # boot even in test mode. The test suite itself uses in-memory fakes for all
    # storage contracts, so no database service is needed.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_HOST: 127.0.0.1

    steps:
      - name: Checkout argus-api
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis, pcntl
          coverage: none

      # Pin testbench to the matrix version before the full update, so Composer
      # picks the right Testbench + Laravel combination in one pass.
      - name: Pin testbench version
        env:
          TESTBENCH_VERSION: ${{ matrix.testbench }}
        run: composer require --dev "orchestra/testbench:${TESTBENCH_VERSION}" --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit
