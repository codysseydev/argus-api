name: Release

# Runs when a version tag is pushed. Packagist auto-updates via the GitHub
# webhook once the release is created here.
#
# IMPORTANT: a matching core release of codysseydev/argus must already be on
# Packagist so this package's ^0.1 dependency resolves. See RELEASING.md.
#
# The test and release jobs are deliberately separate: only `release` holds
# `contents: write`, and it runs no project code: it just creates the GitHub
# Release after `test` passes.

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_HOST: 127.0.0.1

    steps:
      - name: Checkout argus-api
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: redis, pcntl
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit

  release:
    needs: test
    runs-on: ubuntu-latest

    # The only job with write access. It runs no project code; it only creates
    # the GitHub Release for the pushed tag.
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
